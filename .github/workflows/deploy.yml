name: Deploy Discord Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Docker server
        env:
          REMOTE_IP: ${{ secrets.REMOTE_DOCKER_IP }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          # 1. Garante que a pasta existe na VPS e atualiza o código
          ssh -p 7001 -o StrictHostKeyChecking=no ${REMOTE_USER}@${REMOTE_IP} "
            mkdir -p /opt/bot-mc-rcon-discord
            cd /opt/bot-mc-rcon-discord
            if [ -d .git ]; then
              git pull origin main
            else
              git clone git@github.com:${{ github.repository }}.git .
            fi
          "

          # 2. Envia o arquivo .env diretamente do GitHub Actions para a VPS via SSH
          ssh -p 7001 -o StrictHostKeyChecking=no ${REMOTE_USER}@${REMOTE_IP} "cat > /opt/bot-mc-rcon-discord/.env" << EOF
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          RCON_HOST=${{ secrets.RCON_HOST }}
          RCON_PORT=${{ secrets.RCON_PORT }}
          RCON_PASSWORD=${{ secrets.RCON_PASSWORD }}
          EOF

          # 3. Sobe os contêineres Docker
          ssh -p 7001 -o StrictHostKeyChecking=no ${REMOTE_USER}@${REMOTE_IP} "
            cd /opt/bot-mc-rcon-discord
            docker compose down
            docker compose up -d --build
          "