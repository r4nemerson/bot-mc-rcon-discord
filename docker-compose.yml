services:
  discord-bot:
    container_name: bot-mc-rcon-discord

    build:
      context: .

    restart: unless-stopped

    environment:
      - BOT_TOKEN=${DISCORD_TOKEN}

      - RCON_HOST=${RCON_HOST}
      - RCON_PORT=${RCON_PORT}
      - RCON_PASSWORD=${RCON_PASSWORD}

    env_file:
      - .env